plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.daftech.suaraku'
    compileSdk 34

    defaultConfig {
        applicationId 'com.daftech.suaraku'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary = true }
        ndk {
            // HP Putra (Redmi Note 10S) = arm64. Batasi ABI biar APK ramping
            // (AAR sherpa-onnx memuat semua ABI; yang dipakai cuma arm64-v8a).
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Personal install: TANPA suffix .debug supaya package tetap com.daftech.suaraku
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = '2024.06.00'
    implementation platform("androidx.compose:compose-bom:$composeBom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Edge TTS (WebSocket) + HTTP untuk Gemini & unduh model
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Ekstrak model Piper .tar.bz2 di dalam app
    implementation 'org.apache.commons:commons-compress:1.26.2'

    // sherpa-onnx (offline TTS Piper id_ID). File AAR TIDAK masuk repo:
    // diunduh oleh GitHub Actions workflow ke app/libs/ sebelum build.
    // Unduh manual untuk build lokal: lihat README.md.
    implementation files('libs/sherpa-onnx-1.13.8.aar')

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
